name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_L1_RPC_URL: ${{ secrets.VITE_L1_RPC_URL }}
          VITE_TALLY_PROPOSER_ADDRESS: ${{ secrets.VITE_TALLY_PROPOSER_ADDRESS }}
          VITE_SLASHER_ADDRESS: ${{ secrets.VITE_SLASHER_ADDRESS }}
          VITE_ROLLUP_ADDRESS: ${{ secrets.VITE_ROLLUP_ADDRESS }}
          VITE_TESTNET_L1_RPC_URL: ${{ secrets.VITE_TESTNET_L1_RPC_URL }}
          VITE_TESTNET_TALLY_PROPOSER_ADDRESS: ${{ secrets.VITE_TESTNET_TALLY_PROPOSER_ADDRESS }}
          VITE_TESTNET_SLASHER_ADDRESS: ${{ secrets.VITE_TESTNET_SLASHER_ADDRESS }}
          VITE_TESTNET_ROLLUP_ADDRESS: ${{ secrets.VITE_TESTNET_ROLLUP_ADDRESS }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
